name: Daily Security Digest

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 UTC 22:00 = JST 07:00
  workflow_dispatch:         # GitHub画面から手動実行も可能

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # docs/ へのcommit & pushに必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch RSS and generate HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 fetch.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "変更なし。スキップ。"
          else
            git commit -m "digest: $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M') JST"
            git push
          fi
