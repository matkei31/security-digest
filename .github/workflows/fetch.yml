name: Daily Security Digest

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 UTC 22:00 = JST 07:00
  workflow_dispatch:         # GitHub画面から手動実行も可能

concurrency:
  group: daily-security-digest-production
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # docs/ へのcommit & pushに必要

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Fetch RSS and generate HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 fetch.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if git diff --cached --quiet; then
            echo "変更なし。スキップ。"
          else
            git commit -m "digest: $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M') JST"
            git push
          fi
