name: Daily Security Digest

on:
  schedule:
    - cron: '17 22 * * *'  # 毎日 UTC 22:17 = JST 07:17（毎時0分を避ける）
  workflow_dispatch:         # GitHub画面から手動実行も可能

concurrency:
  group: daily-security-digest-production
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # docs/ へのcommit & pushに必要

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch RSS and generate HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 fetch.py

      - name: Generate topic pages
        run: python3 topic_pages.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if git diff --cached --quiet; then
            echo "変更なし。スキップ。"
          else
            git commit -m "digest: $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M') JST"
            git push
          fi
